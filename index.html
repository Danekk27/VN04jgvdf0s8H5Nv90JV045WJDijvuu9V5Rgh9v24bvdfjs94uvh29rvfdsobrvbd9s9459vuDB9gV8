<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TonDrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #18181c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        .pages-wrapper {
            position: absolute;
            inset: 0;
            bottom: 90px;
            overflow: hidden;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        .page h2 {
            font-size: 22px;
            font-weight: 600;
            color: rgba(255,255,255,0.18);
            letter-spacing: 0.5px;
        }

        /* Nav island */
        .nav-island {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #242429;
            border-radius: 32px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 9px 14px;
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 56px;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: stroke 0.35s ease, fill 0.35s ease;
            stroke: #4a4a56;
            fill: none;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #4a4a56;
            transition: color 0.35s ease;
            white-space: nowrap;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.07);
        }

        .nav-item.active svg { stroke: #fff; }
        .nav-item.active svg .dot { fill: #fff; }
        .nav-item.active span { color: #fff; }
    </style>
</head>
<body>

    <div class="pages-wrapper">
        <div class="page active" id="page-home">
            <h2>Главная</h2>
        </div>
        <div class="page" id="page-wallet">
            <h2>Кошелёк</h2>
        </div>
        <div class="page" id="page-lootboxes">
            <h2>Лутбоксы</h2>
        </div>
        <div class="page" id="page-bonuses">
            <h2>Бонусы</h2>
        </div>
        <div class="page" id="page-account">
            <h2>Аккаунт</h2>
        </div>
    </div>

    <nav class="nav-island">

        <div class="nav-item" onclick="switchPage('wallet', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 20H5C3.89543 20 3 19.1046 3 18V9C3 7.89543 3.89543 7 5 7H19C20.1046 7 21 7.89543 21 9V18C21 19.1046 20.1046 20 19 20Z"/>
                <path class="dot" d="M16.5 14C16.2239 14 16 13.7761 16 13.5C16 13.2239 16.2239 13 16.5 13C16.7761 13 17 13.2239 17 13.5C17 13.7761 16.7761 14 16.5 14Z" style="fill:inherit"/>
                <path d="M18 7V5.60322C18 4.28916 16.7544 3.33217 15.4847 3.67075L4.48467 6.60409C3.60917 6.83756 3 7.63046 3 8.53656V9"/>
            </svg>
            <span>Кошелёк</span>
        </div>

        <div class="nav-item" onclick="switchPage('lootboxes', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8H3L4.5 20.5A1.5 1.5 0 0 0 6 22h12a1.5 1.5 0 0 0 1.5-1.5L21 8Z"/>
                <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
                <line x1="12" y1="12" x2="12" y2="17"/>
                <line x1="9.5" y1="14.5" x2="14.5" y2="14.5"/>
            </svg>
            <span>Лутбоксы</span>
        </div>

        <div class="nav-item active" onclick="switchPage('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10.5Z"/>
                <path d="M9 21V13h6v8"/>
            </svg>
            <span>Главная</span>
        </div>

        <div class="nav-item" onclick="switchPage('bonuses', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 12 20 22 4 22 4 12"/>
                <rect x="2" y="7" width="20" height="5" rx="2"/>
                <path d="M12 22V7"/>
                <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/>
                <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/>
            </svg>
            <span>Бонусы</span>
        </div>

        <div class="nav-item" onclick="switchPage('account', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-3.8 3.6-7 8-7s8 3.2 8 7"/>
            </svg>
            <span>Аккаунт</span>
        </div>

    </nav>

    <script>
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        const pageOrder = ['wallet', 'lootboxes', 'home', 'bonuses', 'account'];
        let currentPageId = 'home';
        let isAnimating = false;

        function switchPage(page, el) {
            if (page === currentPageId || isAnimating) return;
            isAnimating = true;

            const currentIdx = pageOrder.indexOf(currentPageId);
            const newIdx = pageOrder.indexOf(page);
            const goingRight = newIdx > currentIdx;

            const oldPage = document.getElementById('page-' + currentPageId);
            const newPage = document.getElementById('page-' + page);
            const duration = 380;
            const easing = 'cubic-bezier(0.4, 0, 0.2, 1)';

            // Position new page off-screen instantly
            newPage.style.transition = 'none';
            newPage.style.transform = goingRight ? 'translateX(100%)' : 'translateX(-100%)';
            newPage.style.opacity = '1';
            newPage.classList.add('active');

            // Force reflow
            newPage.offsetHeight;

            const t = `transform ${duration}ms ${easing}, opacity ${duration}ms ${easing}`;

            // Animate old page out
            oldPage.style.transition = t;
            oldPage.style.transform = goingRight ? 'translateX(-60px)' : 'translateX(60px)';
            oldPage.style.opacity = '0';

            // Animate new page in
            newPage.style.transition = t;
            newPage.style.transform = 'translateX(0)';

            // Update nav immediately
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            currentPageId = page;

            setTimeout(() => {
                oldPage.classList.remove('active');
                oldPage.style.transform = '';
                oldPage.style.opacity = '';
                oldPage.style.transition = '';
                newPage.style.transition = '';
                isAnimating = false;
            }, duration);
        }
    </script>

</body>
</html>
