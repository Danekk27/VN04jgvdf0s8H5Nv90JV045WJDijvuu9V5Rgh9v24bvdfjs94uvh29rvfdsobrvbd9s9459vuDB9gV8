<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TonDrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #18181c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        /* Pages */
        .page {
            position: absolute;
            inset: 0;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            gap: 12px;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .page h2 {
            font-size: 22px;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        /* Nav island */
        .nav-island {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #242429;
            border-radius: 32px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 9px 14px;
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 56px;
            position: relative;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            transition: stroke 0.35s ease;
            flex-shrink: 0;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2px;
            transition: color 0.35s ease;
            white-space: nowrap;
        }

        .nav-item svg { stroke: #4a4a56; }
        .nav-item span { color: #4a4a56; }

        .nav-item.active {
            background: rgba(255,255,255,0.07);
        }

        .nav-item.active svg { stroke: #fff; }
        .nav-item.active span { color: #fff; }
    </style>
</head>
<body>

    <div class="page active" id="page-home">
        <h2>Главная</h2>
    </div>

    <div class="page" id="page-wallet">
        <h2>Кошелёк</h2>
    </div>

    <div class="page" id="page-lootboxes">
        <h2>Лутбоксы</h2>
    </div>

    <div class="page" id="page-bonuses">
        <h2>Бонусы</h2>
    </div>

    <div class="page" id="page-account">
        <h2>Аккаунт</h2>
    </div>

    <nav class="nav-island">

        <div class="nav-item" onclick="switchPage('wallet', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="13" rx="3"/>
                <path d="M2 10h20"/>
                <circle cx="17" cy="14" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <span>Кошелёк</span>
        </div>

        <div class="nav-item" onclick="switchPage('lootboxes', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8H3L4.5 20.5A1.5 1.5 0 0 0 6 22h12a1.5 1.5 0 0 0 1.5-1.5L21 8Z"/>
                <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
                <line x1="12" y1="12" x2="12" y2="17"/>
                <line x1="9.5" y1="14.5" x2="14.5" y2="14.5"/>
            </svg>
            <span>Лутбоксы</span>
        </div>

        <div class="nav-item active" onclick="switchPage('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10.5Z"/>
                <path d="M9 21V13h6v8"/>
            </svg>
            <span>Главная</span>
        </div>

        <div class="nav-item" onclick="switchPage('bonuses', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 12 20 22 4 22 4 12"/>
                <rect x="2" y="7" width="20" height="5" rx="2"/>
                <path d="M12 22V7"/>
                <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/>
                <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/>
            </svg>
            <span>Бонусы</span>
        </div>

        <div class="nav-item" onclick="switchPage('account', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-3.8 3.6-7 8-7s8 3.2 8 7"/>
            </svg>
            <span>Аккаунт</span>
        </div>

    </nav>

    <script>
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        function switchPage(page, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            el.classList.add('active');
        }
    </script>

</body>
</html>
