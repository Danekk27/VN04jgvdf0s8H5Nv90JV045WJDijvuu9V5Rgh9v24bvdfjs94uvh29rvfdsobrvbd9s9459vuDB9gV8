<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TonDrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #18181c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        .pages-wrapper {
            position: absolute;
            inset: 0;
            bottom: 90px;
            overflow: hidden;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        .page h2 {
            font-size: 22px;
            font-weight: 600;
            color: rgba(255,255,255,0.18);
        }

        .balance-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 5px 12px 5px 10px;
            z-index: 100;
        }

        .balance-badge span {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.2px;
        }

        .balance-badge .star {
            font-size: 14px;
        }

        /* Nav island */
        .nav-island {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: #242429;
            border-radius: 16px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 2px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        @keyframes blurPulse {
            0%   { filter: blur(0px); }
            40%  { filter: blur(2px); }
            60%  { filter: blur(2px); }
            100% { filter: blur(0px); }
        }

        /* Sliding indicator */
        .nav-indicator {
            position: absolute;
            border-radius: 14px;
            pointer-events: none;
            z-index: 0;
            background: rgba(255,255,255,0.08);
            transition: left 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        top 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-indicator.moving {
            animation: blurPulse 0.38s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .nav-item {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 4px 11px;
            border-radius: 12px;
            cursor: pointer;
            min-width: 44px;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: #4a4a56;
            fill: none;
            transition: stroke 0.35s ease;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #4a4a56;
            white-space: nowrap;
            transition: color 0.35s ease;
        }

        .nav-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #4a4a56;
            transition: border-color 0.35s ease;
        }

        .nav-item.active .nav-avatar {
            border-color: #fff;
        }

        .nav-avatar-placeholder {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4a4a56;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            color: #fff;
            transition: background 0.35s ease;
        }

        .nav-item.active .nav-avatar-placeholder {
            background: #fff;
            color: #18181c;
        }

        .nav-item.active svg { stroke: #fff; }
        .nav-item.active span { color: #fff; }

        .nav-item svg .fill-icon { fill: #4a4a56; stroke: none; }
        .nav-item.active svg .fill-icon { fill: #fff; stroke: none; }

        /* ===== Pixel Grid Banner ===== */
        #page-account {
            justify-content: flex-start;
            align-items: stretch;
            overflow-y: auto;
            padding: 14px 14px 0;
            gap: 0;
        }

        .pgb-wrapper {
            position: relative;
            width: 100%;
            height: 172px;
            overflow: hidden;
            background: #4d79fc;
            border-radius: 10px;
            flex-shrink: 0;
            cursor: default;
        }


        .pgb-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .pgb-avatar-wrap {
            transform: translateX(-80px);
            position: relative;
            display: inline-flex;
        }

        .pgb-settings-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #242429;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pgb-settings-badge svg {
            width: 17px;
            height: 17px;
        }

        .pgb-avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .pgb-avatar-ph {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="balance-badge">
        <span class="star">⭐</span>
        <span>499</span>
    </div>

    <div class="pages-wrapper">
        <div class="page active" id="page-home"><h2>Главная</h2></div>
        <div class="page" id="page-wallet"><h2>Кошелёк</h2></div>
        <div class="page" id="page-lootboxes"><h2>Лутбоксы</h2></div>
        <div class="page" id="page-bonuses"><h2>Бонусы</h2></div>
        <div class="page" id="page-account">
            <div class="pgb-wrapper" id="pgbWrapper">
                <div class="pgb-overlay">
                    <div class="pgb-avatar-wrap">
                        <div class="pgb-avatar-ph" id="pgbAvatarPh">?</div>
                        <div class="pgb-settings-badge">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M19.6224 10.3954L18.5247 7.7448L20 6L18 4L16.2647 5.48295L13.5578 4.36974L12.9353 2H10.981L10.3491 4.40113L7.70441 5.51596L6 4L4 6L5.45337 7.78885L4.3725 10.4463L2 11V13L4.40111 13.6555L5.51575 16.2997L4 18L6 20L7.79116 18.5403L10.397 19.6123L11 22H13L13.6045 19.6132L16.2551 18.5155C16.6969 18.8313 18 20 18 20L20 18L18.5159 16.2494L19.6139 13.598L21.9999 12.9772L22 11L19.6224 10.3954Z" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav-island" id="navIsland">
        <div class="nav-indicator" id="navIndicator"></div>

        <div class="nav-item" id="tab-wallet" onclick="switchPage('wallet', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 20H5C3.89543 20 3 19.1046 3 18V9C3 7.89543 3.89543 7 5 7H19C20.1046 7 21 7.89543 21 9V18C21 19.1046 20.1046 20 19 20Z"/>
                <path d="M16.5 14C16.2239 14 16 13.7761 16 13.5C16 13.2239 16.2239 13 16.5 13C16.7761 13 17 13.2239 17 13.5C17 13.7761 16.7761 14 16.5 14Z" style="fill:#4a4a56; stroke:#4a4a56" id="walletDot"/>
                <path d="M18 7V5.60322C18 4.28916 16.7544 3.33217 15.4847 3.67075L4.48467 6.60409C3.60917 6.83756 3 7.63046 3 8.53656V9"/>
            </svg>
            <span>Кошелёк</span>
        </div>

        <div class="nav-item" id="tab-lootboxes" onclick="switchPage('lootboxes', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12V21.4C20 21.7314 19.7314 22 19.4 22H4.6C4.26863 22 4 21.7314 4 21.4V12"/>
                <path d="M21.4 7H2.6C2.26863 7 2 7.26863 2 7.6V11.4C2 11.7314 2.26863 12 2.6 12H21.4C21.7314 12 22 11.7314 22 11.4V7.6C22 7.26863 21.7314 7 21.4 7Z"/>
                <path d="M12 22V7"/>
                <path d="M12 7H7.5C6.83696 7 6.20107 6.73661 5.73223 6.26777C5.26339 5.79893 5 5.16304 5 4.5C5 3.83696 5.26339 3.20107 5.73223 2.73223C6.20107 2.26339 6.83696 2 7.5 2C11 2 12 7 12 7Z"/>
                <path d="M12 7H16.5C17.163 7 17.7989 6.73661 18.2678 6.26777C18.7366 5.79893 19 5.16304 19 4.5C19 3.83696 18.7366 3.20107 18.2678 2.73223C17.7989 2.26339 17.163 2 16.5 2C13 2 12 7 12 7Z"/>
            </svg>
            <span>Лутбоксы</span>
        </div>

        <div class="nav-item active" id="tab-home" onclick="switchPage('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 8.5L9.8 9L2.35172 12.3856C2.13752 12.4829 2 12.6965 2 12.9318V13.0682C2 13.3035 2.13752 13.5171 2.35172 13.6144L11.1724 17.6238C11.6982 17.8628 12.3018 17.8628 12.8276 17.6238L21.6483 13.6144C21.8625 13.5171 22 13.3035 22 13.0682V12.9318C22 12.6965 21.8625 12.4829 21.6483 12.3856L14.2 9L13 8.5"/>
                <path d="M22 13V17.112C22 17.3482 21.8615 17.5623 21.6462 17.6592L12.8207 21.6307C12.2988 21.8655 11.7012 21.8655 11.1793 21.6307L2.35378 17.6592C2.13847 17.5623 2 17.3482 2 17.112V13"/>
                <path d="M12 8C10.3431 8 9 6.65685 9 5C9 3.34315 10.3431 2 12 2C13.6569 2 15 3.34315 15 5C15 6.65685 13.6569 8 12 8Z"/>
                <path d="M11 8V13C11 13.5523 11.4477 14 12 14V14C12.5523 14 13 13.5523 13 13V8"/>
                <path d="M16 13H17"/>
            </svg>
            <span>Главная</span>
        </div>

        <div class="nav-item" id="tab-bonuses" onclick="switchPage('bonuses', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="4"/>
                <line x1="12" y1="2" x2="12" y2="8"/>
                <line x1="12" y1="16" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="8" y2="12"/>
                <line x1="16" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="4.93" x2="8.05" y2="8.05"/>
                <line x1="15.95" y1="15.95" x2="19.07" y2="19.07"/>
                <line x1="19.07" y1="4.93" x2="15.95" y2="8.05"/>
                <line x1="8.05" y1="15.95" x2="4.93" y2="19.07"/>
                <circle cx="12" cy="4" r="1" class="fill-icon"/>
            </svg>
            <span>Бонусы</span>
        </div>

        <div class="nav-item" id="tab-account" onclick="switchPage('account', this)">
            <div id="avatarContainer">
                <div class="nav-avatar-placeholder" id="avatarPlaceholder">?</div>
            </div>
            <span>Аккаунт</span>
        </div>
    </nav>

    <script>
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // Load Telegram avatar
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tgUser) {
            const container = document.getElementById('avatarContainer');
            if (tgUser.photo_url) {
                const img = document.createElement('img');
                img.src = tgUser.photo_url;
                img.className = 'nav-avatar';
                img.onerror = () => showInitials(tgUser);
                container.innerHTML = '';
                container.appendChild(img);
            } else {
                showInitials(tgUser);
            }
        }

        function showInitials(user) {
            const initials = (user.first_name?.[0] || '') + (user.last_name?.[0] || '');
            document.getElementById('avatarPlaceholder').textContent = initials || '?';
        }

        let currentPageId = 'home';

        function moveIndicator(el) {
            const island = document.getElementById('navIsland');
            const indicator = document.getElementById('navIndicator');
            const islandRect = island.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            indicator.style.left = (elRect.left - islandRect.left) + 'px';
            indicator.style.top = (elRect.top - islandRect.top) + 'px';
            indicator.style.width = elRect.width + 'px';
            indicator.style.height = elRect.height + 'px';

            indicator.classList.remove('moving');
            void indicator.offsetWidth;
            indicator.classList.add('moving');
            clearTimeout(indicator._t);
            indicator._t = setTimeout(() => indicator.classList.remove('moving'), 380);
        }

        function switchPage(page, el) {
            if (page === currentPageId) return;

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');
            el.classList.add('active');

            moveIndicator(el);

            // Wallet dot color sync
            const dot = document.getElementById('walletDot');
            if (dot) {
                const c = page === 'wallet' ? '#fff' : '#4a4a56';
                dot.style.fill = c;
                dot.style.stroke = c;
            }

            currentPageId = page;
        }

        // ===== Banner gradient =====
        const PGB_GLOW_R  = 280;
        const PGB_BASE    = '#4d79fc';
        const PGB_MID     = '#6b96fd';
        const PGB_CENTER  = '#a8ccff';

        function pgbDraw(wrapper, x, y) {
            wrapper.style.background =
                `radial-gradient(circle ${PGB_GLOW_R}px at ${x}px ${y}px, ${PGB_CENTER} 0%, ${PGB_MID} 40%, ${PGB_BASE} 100%)`;
        }

        function pgbInit() {
            const wrapper = document.getElementById('pgbWrapper');
            if (!wrapper) return;

            let pgbT = 0;
            function pgbAutoLoop() {
                pgbT += 0.0014;
                const w = wrapper.offsetWidth;
                const h = wrapper.offsetHeight;

                const px = Math.sin(pgbT          ) * 0.38
                         + Math.sin(pgbT * 1.6180 ) * 0.28
                         + Math.sin(pgbT * 2.7320 ) * 0.18
                         + Math.sin(pgbT * 0.3820 ) * 0.16;

                const py = Math.sin(pgbT * 1.4142 + 1.10) * 0.38
                         + Math.sin(pgbT * 0.5774 + 0.70) * 0.28
                         + Math.sin(pgbT * 2.2360 + 2.30) * 0.18
                         + Math.sin(pgbT * 1.7321 + 0.40) * 0.16;

                const x = w / 2 + w * 0.36 * px;
                const y = h / 2 + h * 0.28 * py;
                pgbDraw(wrapper, x, y);
                requestAnimationFrame(pgbAutoLoop);
            }
            requestAnimationFrame(pgbAutoLoop);
        }

        // Init indicator on home tab without animation
        window.addEventListener('load', () => {
            const indicator = document.getElementById('navIndicator');
            indicator.style.transition = 'none';
            moveIndicator(document.getElementById('tab-home'));
            requestAnimationFrame(() => {
                indicator.style.transition = '';
            });
            pgbInit();

            // Populate banner avatar
            const pgbPh = document.getElementById('pgbAvatarPh');
            if (tgUser && pgbPh) {
                const wrap = pgbPh.parentElement;
                if (tgUser.photo_url) {
                    const img = document.createElement('img');
                    img.src = tgUser.photo_url;
                    img.className = 'pgb-avatar-img';
                    img.onerror = () => {
                        const initials = (tgUser.first_name?.[0] || '') + (tgUser.last_name?.[0] || '');
                        pgbPh.textContent = initials || '?';
                    };
                    wrap.innerHTML = '';
                    wrap.appendChild(img);
                } else {
                    const initials = (tgUser.first_name?.[0] || '') + (tgUser.last_name?.[0] || '');
                    pgbPh.textContent = initials || '?';
                }
            }
        });
    </script>

</body>
</html>
