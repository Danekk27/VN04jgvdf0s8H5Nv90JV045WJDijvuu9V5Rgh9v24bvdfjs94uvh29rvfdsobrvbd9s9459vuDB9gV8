<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TonDrop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #18181c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        .pages-wrapper {
            position: absolute;
            inset: 0;
            bottom: 90px;
            overflow: hidden;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        .page h2 {
            font-size: 22px;
            font-weight: 600;
            color: rgba(255,255,255,0.18);
        }

        .balance-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(48,161,245,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            padding: 7px 13px 7px 9px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .balance-badge span {
            font-size: 13px;
            font-weight: 650;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .balance-amount {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .balance-badge svg {
            flex-shrink: 0;
            filter: drop-shadow(0 0 4px rgba(48,161,245,0.6));
        }

        .gram-ticker {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            font-size: 10px;
            font-weight: 800;
            color: rgba(255,255,255,0.45);
            letter-spacing: 1px;
            margin-left: 1px;
        }

        /* Nav island */
        .nav-island {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: #242429;
            border-radius: 16px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 2px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        @keyframes blurPulse {
            0%   { filter: blur(0px); }
            40%  { filter: blur(2px); }
            60%  { filter: blur(2px); }
            100% { filter: blur(0px); }
        }

        /* Sliding indicator */
        .nav-indicator {
            position: absolute;
            border-radius: 14px;
            pointer-events: none;
            z-index: 0;
            background: rgba(255,255,255,0.08);
            transition: left 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        top 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-indicator.moving {
            animation: blurPulse 0.38s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .nav-item {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 4px 11px;
            border-radius: 12px;
            cursor: pointer;
            min-width: 44px;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: #4a4a56;
            fill: none;
            transition: stroke 0.35s ease;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #4a4a56;
            white-space: nowrap;
            transition: color 0.35s ease;
        }

        .nav-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #4a4a56;
            transition: border-color 0.35s ease;
        }

        .nav-item.active .nav-avatar {
            border-color: #fff;
        }

        .nav-avatar-placeholder {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4a4a56;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            color: #fff;
            transition: background 0.35s ease;
        }

        .nav-item.active .nav-avatar-placeholder {
            background: #fff;
            color: #18181c;
        }

        .nav-item.active svg { stroke: #fff; }
        .nav-item.active span { color: #fff; }

        .nav-item svg .fill-icon { fill: #4a4a56; stroke: none; }
        .nav-item.active svg .fill-icon { fill: #fff; stroke: none; }

        /* ===== Account Banner (Glassmorphism) ===== */
        #page-account {
            justify-content: flex-start;
            align-items: stretch;
            overflow-y: auto;
            padding: 60px 14px 0;
            gap: 0;
        }

        .pgb-scene {
            position: relative;
            width: 100%;
            height: 172px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #242429;
        }

        .pgb-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .pgb-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px;
            gap: 20px;
            z-index: 1;
        }

        .pgb-avatar-wrap {
            position: relative;
            display: inline-flex;
            flex-shrink: 0;
        }

        .pgb-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .pgb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 12px;
            padding: 11px 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .pgb-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.97);
        }

        .pgb-btn span {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .pgb-settings-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #242429;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pgb-settings-badge svg {
            width: 20px;
            height: 20px;
        }

        .pgb-avatar-img {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .pgb-avatar-ph {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 700;
            color: #fff;
        }
        /* ===== Best Drop ===== */
        .best-drop-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .best-drop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
            width: 44px;
        }

        .best-drop-icon svg {
            width: 28px;
            height: 28px;
            stroke: rgba(255,255,255,0.5);
            fill: none;
        }

        .best-drop-icon-label {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .best-drop-card {
            flex: 1;
            background: #242429;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 11px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .best-drop-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .best-drop-label svg {
            width: 14px;
            height: 14px;
            fill: #f59e0b;
            stroke: none;
            flex-shrink: 0;
        }

        .best-drop-item {
            font-size: 15px;
            font-weight: 400;
            color: #fff;
        }

        .best-drop-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .best-drop-lootbox-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            padding: 4px 8px;
        }

        .best-drop-lootbox-btn svg {
            width: 12px;
            height: 12px;
            stroke: rgba(255,255,255,0.5);
            fill: none;
            flex-shrink: 0;
        }

        .best-drop-lootbox-btn span {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
        }

        .best-drop-from {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
        }

        .best-drop-from span {
            color: rgba(255,255,255,0.4);
            font-weight: 400;
        }

        /* ===== Welcome Screen ===== */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: #18181c;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.6s ease;
        }

        .welcome-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-emoji {
            animation: welcomePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            filter: drop-shadow(0 8px 32px rgba(0,0,0,0.5));
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            animation: welcomeFadeUp 0.5s 0.15s ease both;
        }

        .welcome-sub {
            font-size: 15px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            animation: welcomeFadeUp 0.5s 0.25s ease both;
        }

        .welcome-bar-wrap {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 100px;
            overflow: hidden;
        }

        .welcome-bar {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 100px;
            animation: welcomeProgress 2.1s 0.3s linear forwards;
        }

        @keyframes welcomePop {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        @keyframes welcomeFadeUp {
            from { transform: translateY(12px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @keyframes welcomeProgress {
            from { width: 0%; }
            to   { width: 100%; }
        }


        /* ===== Settings Bottom Sheet ===== */
        .settings-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .settings-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        .settings-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e1e23;
            border-radius: 20px 20px 0 0;
            z-index: 201;
            padding: 0 16px 36px;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .settings-sheet.open {
            transform: translateY(0);
        }

        .settings-pill-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 0 18px;
            cursor: pointer;
        }

        .settings-pill-bar {
            width: 64px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 100px;
        }

        .settings-pill-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.2px;
        }

        .settings-section {
            margin-bottom: 8px;
        }

        .settings-section-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 10px;
        }

        .settings-lang-row {
            display: flex;
            gap: 8px;
        }

        .settings-lang-btn {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .settings-lang-btn.active {
            background: rgba(48,161,245,0.15);
            border-color: rgba(48,161,245,0.4);
            color: #30A1F5;
            font-weight: 600;
        }

        .settings-lang-btn:active {
            opacity: 0.7;
        }

        .lang-flag {
            position: absolute;
            left: -16px;
            top: 0;
            bottom: 0;
            width: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, black 20%, transparent 80%);
            mask-image: linear-gradient(to right, black 20%, transparent 80%);
        }

        .lang-flag .fi {
            width: 80px;
            height: 43px;
            border-radius: 6px;
        }

        .settings-divider {
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 8px 0;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-row-label {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        /* Toggle switch */
        .settings-toggle {
            width: 48px;
            height: 28px;
            border-radius: 100px;
            background: #3a3a42;
            position: relative;
            cursor: pointer;
            transition: background 0.25s ease;
            flex-shrink: 0;
        }

        .settings-toggle.on {
            background: #30A1F5;
        }

        .settings-toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .settings-toggle.on .settings-toggle-thumb {
            transform: translateX(20px);
        }

        .settings-demo-badge {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 5px 11px;
        }
    </style>
</head>
<body>

    <div class="pages-wrapper">
        <div class="page active" id="page-home"><h2>Главная</h2></div>
        <div class="page" id="page-wallet"><h2>Кошелёк</h2></div>
        <div class="page" id="page-lootboxes"><h2>Лутбоксы</h2></div>
        <div class="page" id="page-bonuses"><h2>Бонусы</h2></div>
        <div class="page" id="page-account">
            <div class="pgb-scene">
            <div class="pgb-wrapper" id="pgbWrapper">
                <div class="pgb-overlay">
                    <div class="pgb-avatar-wrap">
                        <div class="pgb-avatar-ph" id="pgbAvatarPh">?</div>

                            </svg>
                        </div>
                    </div>
                    <div class="pgb-buttons">
                        <div class="pgb-btn">
                            <span>Профиль</span>
                        </div>
                        <div class="pgb-btn">
                            <span>Рейтинг</span>
                        </div>
                    </div>
                </div>
            </div>
            </div>

            <div class="best-drop-row">
                <div class="best-drop-card">
                    <span class="best-drop-label">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        Лучший дроп
                    </span>
                    <span class="best-drop-item">text-text</span>
                    <div class="best-drop-bottom">
                        <div class="best-drop-lootbox-btn">
                            <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 12V21.4C20 21.7314 19.7314 22 19.4 22H4.6C4.26863 22 4 21.7314 4 21.4V12"/>
                                <path d="M21.4 7H2.6C2.26863 7 2 7.26863 2 7.6V11.4C2 11.7314 2.26863 12 2.6 12H21.4C21.7314 12 22 11.7314 22 11.4V7.6C22 7.26863 21.7314 7 21.4 7Z"/>
                                <path d="M12 22V7"/>
                                <path d="M12 7H7.5C6.83696 7 6.20107 6.73661 5.73223 6.26777C5.26339 5.79893 5 5.16304 5 4.5C5 3.83696 5.26339 3.20107 5.73223 2.73223C6.20107 2.26339 6.83696 2 7.5 2C11 2 12 7 12 7Z"/>
                                <path d="M12 7H16.5C17.163 7 17.7989 6.73661 18.2678 6.26777C18.7366 5.79893 19 5.16304 19 4.5C19 3.83696 18.7366 3.20107 18.2678 2.73223C17.7989 2.26339 17.163 2 16.5 2C13 2 12 7 12 7Z"/>

    </div>

    <nav class="nav-island" id="navIsland">
        <div class="nav-indicator" id="navIndicator"></div>

        <div class="nav-item" id="tab-wallet" onclick="switchPage('wallet', this)">

                <path d="M19 20H5C3.89543 20 3 19.1046 3 18V9C3 7.89543 3.89543 7 5 7H19C20.1046 7 21 7.89543 21 9V18C21 19.1046 20.1046 20 19 20Z"/>
                <path d="M16.5 14C16.2239 14 16 13.7761 16 13.5C16 13.2239 16.2239 13 16.5 13C16.7761 13 17 13.2239 17 13.5C17 13.7761 16.7761 14 16.5 14Z" style="fill:#4a4a56; stroke:#4a4a56" id="walletDot"/>
                <path d="M18 7V5.60322C18 4.28916 16.7544 3.33217 15.4847 3.67075L4.48467 6.60409C3.60917 6.83756 3 7.63046 3 8.53656V9"/>

        <div class="nav-item" id="tab-lootboxes" onclick="switchPage('lootboxes', this)">

                <path d="M21.4 7H2.6C2.26863 7 2 7.26863 2 7.6V11.4C2 11.7314 2.26863 12 2.6 12H21.4C21.7314 12 22 11.7314 22 11.4V7.6C22 7.26863 21.7314 7 21.4 7Z"/>
                <path d="M12 22V7"/>
                <path d="M12 7H7.5C6.83696 7 6.20107 6.73661 5.73223 6.26777C5.26339 5.79893 5 5.16304 5 4.5C5 3.83696 5.26339 3.20107 5.73223 2.73223C6.20107 2.26339 6.83696 2 7.5 2C11 2 12 7 12 7Z"/>
                <path d="M12 7H16.5C17.163 7 17.7989 6.73661 18.2678 6.26777C18.7366 5.79893 19 5.16304 19 4.5C19 3.83696 18.7366 3.20107 18.2678 2.73223C17.7989 2.26339 17.163 2 16.5 2C13 2 12 7 12 7Z"/>
            </svg>
            <span>Лутбоксы</span>
        </div>

        <div class="nav-item active" id="tab-home" onclick="switchPage('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 8.5L9.8 9L2.35172 12.3856C2.13752 12.4829 2 12.6965 2 12.9318V13.0682C2 13.3035 2.13752 13.5171 2.35172 13.6144L11.1724 17.6238C11.6982 17.8628 12.3018 17.8628 12.8276 17.6238L21.6483 13.6144C21.8625 13.5171 22 13.3035 22 13.0682V12.9318C22 12.6965 21.8625 12.4829 21.6483 12.3856L14.2 9L13 8.5"/>
                <path d="M22 13V17.112C22 17.3482 21.8615 17.5623 21.6462 17.6592L12.8207 21.6307C12.2988 21.8655 11.7012 21.8655 11.1793 21.6307L2.35378 17.6592C2.13847 17.5623 2 17.3482 2 17.112V13"/>
                <path d="M12 8C10.3431 8 9 6.65685 9 5C9 3.34315 10.3431 2 12 2C13.6569 2 15 3.34315 15 5C15 6.65685 13.6569 8 12 8Z"/>
                <path d="M11 8V13C11 13.5523 11.4477 14 12 14V14C12.5523 14 13 13.5523 13 13V8"/>
                <path d="M16 13H17"/>

            <span>Главная</span>

        <div class="nav-item" id="tab-bonuses" onclick="switchPage('bonuses', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="4"/>
                <line x1="12" y1="2" x2="12" y2="8"/>
                <line x1="12" y1="16" x2="12" y2="22"/>

                <line x1="16" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="4.93" x2="8.05" y2="8.05"/>
                <line x1="15.95" y1="15.95" x2="19.07" y2="19.07"/>
                <line x1="19.07" y1="4.93" x2="15.95" y2="8.05"/>
                <line x1="8.05" y1="15.95" x2="4.93" y2="19.07"/>

            <span>Бонусы</span>
        </div>

        <div class="nav-item" id="tab-account" onclick="switchPage('account', this)">
            <div id="avatarContainer">
                <div class="nav-avatar-placeholder" id="avatarPlaceholder">?</div>

        </div>

    <div class="welcome-screen" id="welcomeScreen">
        <div id="tgsContainer" class="welcome-emoji" style="width:160px;height:160px;"></div>
        <div class="welcome-title">TonDrop</div>
        <div class="welcome-sub">Открывай кейсы. Побеждай.</div>
        <div class="welcome-bar-wrap">
            <div class="welcome-bar"></div>
        </div>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>
    <div class="settings-sheet" id="settingsSheet">
        <div class="settings-pill-wrap" onclick="closeSettings()">
            <div class="settings-pill-bar"></div>
        </div>

        <div class="settings-section">
            <span class="settings-section-title">Язык</span>
            <div class="settings-lang-row">
                <div class="settings-lang-btn active" id="langRu" onclick="setLang('ru')"><span class="lang-flag"><span class="fi fi-ru"></span></span>Русский</div>
                <div class="settings-lang-btn" id="langEn" onclick="setLang('en')"><span class="lang-flag"><span class="fi fi-us"></span></span>English</div>
            </div>
        </div>

        <div class="settings-divider"></div>

        <div class="settings-row">
            <span class="settings-row-label">Вибрация</span>
            <div class="settings-toggle" id="vibrationToggle" onclick="toggleVibration()">
                <div class="settings-toggle-thumb"></div>
            </div>
        </div>

        <div class="settings-row">
            <span class="settings-row-label">Демо</span>
            <div class="settings-toggle" id="demoToggle" onclick="toggleDemo()">
                <div class="settings-toggle-thumb"></div>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // Load Telegram avatar
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tgUser) {
            const container = document.getElementById('avatarContainer');
            if (tgUser.photo_url) {
                const img = document.createElement('img');
                img.src = tgUser.photo_url;
                img.className = 'nav-avatar';
                img.onerror = () => showInitials(tgUser);
                container.innerHTML = '';
                container.appendChild(img);
            } else {
                showInitials(tgUser);
            }
        }

        function showInitials(user) {
            const initials = (user.first_name?.[0] || '') + (user.last_name?.[0] || '');
            document.getElementById('avatarPlaceholder').textContent = initials || '?';
        }

        let currentPageId = 'home';

        function moveIndicator(el) {
            const island = document.getElementById('navIsland');
            const indicator = document.getElementById('navIndicator');
            const islandRect = island.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            indicator.style.left = (elRect.left - islandRect.left) + 'px';
            indicator.style.top = (elRect.top - islandRect.top) + 'px';
            indicator.style.width = elRect.width + 'px';
            indicator.style.height = elRect.height + 'px';

            indicator.classList.remove('moving');
            void indicator.offsetWidth;
            indicator.classList.add('moving');
            clearTimeout(indicator._t);
            indicator._t = setTimeout(() => indicator.classList.remove('moving'), 380);
        }

        function switchPage(page, el) {
            if (page === currentPageId) return;

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');
            el.classList.add('active');

            moveIndicator(el);

            // Wallet dot color sync
            const dot = document.getElementById('walletDot');
            if (dot) {
                const c = page === 'wallet' ? '#fff' : '#4a4a56';
                dot.style.fill = c;
                dot.style.stroke = c;
            }

            currentPageId = page;
        }

        // Init indicator on home tab without animation
        window.addEventListener('load', () => {
            const indicator = document.getElementById('navIndicator');
            indicator.style.transition = 'none';
            moveIndicator(document.getElementById('tab-home'));
            requestAnimationFrame(() => {
                indicator.style.transition = '';
            });

            // Populate banner avatar
            const pgbPh = document.getElementById('pgbAvatarPh');
            if (tgUser && pgbPh) {
                if (tgUser.photo_url) {
                    const img = document.createElement('img');
                    img.src = tgUser.photo_url;
                    img.className = 'pgb-avatar-img';
                    img.onerror = () => {
                        const initials = (tgUser.first_name?.[0] || '') + (tgUser.last_name?.[0] || '');
                        pgbPh.textContent = initials || '?';
                        pgbPh.id = 'pgbAvatarPh';
                    };
                    pgbPh.replaceWith(img);
                } else {
                    const initials = (tgUser.first_name?.[0] || '') + (tgUser.last_name?.[0] || '');
                    pgbPh.textContent = initials || '?';
                }
            }
        });
        // TGS loader
        (async () => {
            try {
                const res = await fetch('5255975823436973213.tgs');
                const buf = await res.arrayBuffer();
                const decompressed = pako.inflate(new Uint8Array(buf), { to: 'string' });
                const animData = JSON.parse(decompressed);
                lottie.loadAnimation({
                    container: document.getElementById('tgsContainer'),
                    animationData: animData,
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                });
            } catch(e) {
                console.warn('TGS load error:', e);
            }
        })();

        // Welcome screen
        setTimeout(() => {
            const ws = document.getElementById('welcomeScreen');
            ws.classList.add('hide');
            setTimeout(() => ws.remove(), 600);
        }, 2600);

        // Settings sheet
        const sheet = document.getElementById('settingsSheet');
        const backdrop = document.getElementById('settingsBackdrop');

        function openSettings() {
            sheet.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)';
            backdrop.classList.add('open');
            sheet.classList.add('open');
        }

        function closeSettings() {
            sheet.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)';
            backdrop.classList.remove('open');
            sheet.classList.remove('open');
        }

        // Drag to dismiss
        let dragStartY = 0;
        let dragCurrentY = 0;
        let isDragging = false;

        function snapBack() {
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
            sheet.style.transform = 'translateY(0)';
            backdrop.style.transition = 'opacity 0.3s ease';
            backdrop.style.opacity = '0.55';
            setTimeout(() => {
                sheet.style.transition = '';
                sheet.style.transform = '';
                backdrop.style.transition = '';
                backdrop.style.opacity = '';
            }, 300);
        }

        function snapClose() {
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
            sheet.style.transform = 'translateY(100%)';
            backdrop.style.transition = 'opacity 0.3s ease';
            backdrop.style.opacity = '0';
            setTimeout(() => {
                sheet.classList.remove('open');
                backdrop.classList.remove('open');
                sheet.style.transition = '';
                sheet.style.transform = '';
                backdrop.style.transition = '';
                backdrop.style.opacity = '';
            }, 300);
        }

        sheet.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.settings-toggle') || e.target.closest('.settings-lang-btn')) return;
            dragStartY = e.clientY;
            dragCurrentY = 0;
            isDragging = true;
            sheet.style.transition = 'none';
            backdrop.style.transition = 'none';
            sheet.setPointerCapture(e.pointerId);
        });

        sheet.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const delta = e.clientY - dragStartY;
            if (delta < 0) return;
            dragCurrentY = delta;
            sheet.style.transform = `translateY(${delta}px)`;
            backdrop.style.opacity = Math.max(0, 0.55 * (1 - delta / sheet.offsetHeight));
        });

        sheet.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            dragCurrentY > sheet.offsetHeight * 0.45 ? snapClose() : snapBack();
        });

        sheet.addEventListener('pointercancel', () => {
            if (!isDragging) return;
            isDragging = false;
            snapBack();
        });

        function setLang(lang) {
            document.getElementById('langRu').classList.toggle('active', lang === 'ru');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
        }

        let demoOn = false;
        function toggleDemo() {
            demoOn = !demoOn;
            document.getElementById('demoToggle').classList.toggle('on', demoOn);
        }

        let vibrationOn = false;
        function toggleVibration() {
            vibrationOn = !vibrationOn;
            document.getElementById('vibrationToggle').classList.toggle('on', vibrationOn);
            if (vibrationOn && window.Telegram?.WebApp?.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
